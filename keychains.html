<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keychains</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="site-header">
    <div class="search-box" id="searchBox">
        <input type="text" class="search-input" id="searchInput" placeholder="What are you looking for?" aria-label="Search products">
        <span class="search-hint" id="searchHint">What are you looking for?</span>
        <div class="search-results" id="searchResults"></div>
    </div>
    <button class="search-toggle" id="searchToggle" type="button"><img src="search.png" alt="Search"></button>
    <a href="cart.html" class="cart-button" id="cartButton" aria-label="Cart">
        <img src="cart.jpg" alt="Cart">
        <span class="cart-badge hidden" id="cartBadge">0</span>
    </a>
</div>

<div class="container">


    <!-- Page title -->
    <h1>Keychains</h1>



    <!-- Holds every product -->
    <div class="product-grid">



        <!-- ===== Keychain #1 ===== -->
        <div class="product-card" data-title="Crochet Keychain" data-description="This is a keychain item. Write your description here." data-link="keychains.html">


            <!-- Product image -->
            <div class="image-container" tabindex="0" role="button" aria-label="View details for Crochet Keychain" data-image="images/keychain1.jpg" data-title="Crochet Keychain" data-price="10,000 LBP" data-description="This is a keychain item. Write your description here.">
                <img src="images/keychain1.jpg" alt="Crochet Keychain">
                <div class="overlay">View Details</div>
            </div>


            <!-- Product name -->
            <h2>Crochet Keychain</h2>


            <!-- Product price -->
            <p class="price">10,000 LBP</p>


        </div>





        <!-- ===== Keychain #2 ===== -->
        <div class="product-card" data-title="Mini Keychain" data-description="This is a keychain item. Write your description here." data-link="keychains.html">


            <div class="image-container" tabindex="0" role="button" aria-label="View details for Mini Keychain" data-image="images/keychain2.jpg" data-title="Mini Keychain" data-price="15,000 LBP" data-description="This is a keychain item. Write your description here.">
                <img src="images/keychain2.jpg" alt="Crochet Keychain">
                <div class="overlay">View Details</div>
            </div>


            <h2>Mini Keychain</h2>


            <p class="price">15,000 LBP</p>


        </div>

    </div>




    <!-- Back button -->
    <a href="index.html" class="button">
        Back
    </a>



</div>

<div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button class="modal-close" aria-label="Close">&times;</button>
        <img class="detail-image" src="" alt="">
        <h2 class="detail-name"></h2>
        <p class="detail-price"></p>
        <!-- This is the place to write your description. -->
        <p class="detail-description"></p>
        <div class="modal-actions">
            <button id="inquireButton" class="inquire-button">Inquire</button>
            <button id="addToCartButton" class="add-to-cart-button">Add to cart</button>
            <a id="instagramButton" class="instagram-button hidden" href="https://www.instagram.com/onemorestitch.lb?igsh=cTN5Mm93dzJjZDBz&utm_source=qr" target="_blank" rel="noopener noreferrer">Contact on Instagram</a>
        </div>
    </div>
</div>

</body>

<script src="product-modal.js"></script>
<script src="site-ui.js"></script>
<script src="cart-badge.js"></script>

</html>
