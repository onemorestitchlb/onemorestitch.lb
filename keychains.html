<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KEYCHAINS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="site-header">
    <div class="search-box" id="searchBox">
        <input type="text" class="search-input" id="searchInput" placeholder="What are you looking for?" aria-label="Search products">
        <span class="search-hint" id="searchHint">What are you looking for?</span>
        <div class="search-results" id="searchResults"></div>
    </div>
    <button class="search-toggle" id="searchToggle" type="button"><img src="search.png" alt="search"></button>
        <a href="cart.html" class="cart-button" id="cartButton" aria-label="Cart">
            <img src="cart-removebg-preview.png" alt="cart">
            <span class="cart-badge hidden" id="cartBadge">0</span>
        </a>
</div>

<div class="container">


    <!-- Page title -->
    <h1>KEYCHAINS</h1>



    <!-- Holds every product -->
    <div class="product-grid">



        <!-- ===== Keychain #1 ===== -->
        <div class="product-card" data-title="Crochet Keychain" data-description="This is a keychain item. Write your description here." data-link="keychains.html">


            <!-- Product image -->
            <div class="image-container" tabindex="0" role="button" aria-label="View details for Crochet Keychain" data-images="images/keychain1.svg" data-title="Crochet Keychain" data-price="10,000 LBP" data-description="This is a keychain item. Write your description here.">
                <img src="images/keychain1.svg" alt="Crochet Keychain">
                <div class="overlay">View Details</div>
            </div>


            <!-- Product name -->
            <h2>Crochet Keychain</h2>


            <!-- Product price -->
            <p class="price">$10.00</p>


        </div>





        <!-- ===== Keychain #2 ===== -->
        <div class="product-card" data-title="Mini Keychain" data-description="This is a keychain item. Write your description here." data-link="keychains.html">


            <div class="image-container" tabindex="0" role="button" aria-label="View details for Mini Keychain" data-images="images/keychain2.svg" data-title="Mini Keychain" data-price="15,000 LBP" data-description="This is a keychain item. Write your description here.">
                <img src="images/keychain2.svg" alt="Mini Keychain">
                <div class="overlay">View Details</div>
            </div>


            <h2>Mini Keychain</h2>


            <p class="price">$15.00</p>


        </div>

    </div>




    <!-- Back button -->
    <a href="index.html" class="button">
        Back
    </a>



</div>

<div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button class="modal-close" aria-label="Close">&times;</button>
        <div class="detail-gallery">
            <img class="detail-image" src="" alt="">
        </div>
        <h2 class="detail-name"></h2>
        <p class="detail-price"></p>
        <p class="detail-description"></p>
        <div class="modal-actions">
            <button id="inquireButton" class="inquire-button">Inquire</button>
            <button id="addToCartButton" class="add-to-cart-button">Add to cart</button>
        </div>
    </div>
</div>

</body>

<script src="product-modal.js"></script>
<script src="site-ui.js"></script>
<script src="cart-badge.js"></script>

</html>
