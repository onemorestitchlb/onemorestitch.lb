<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bags</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site-header">
    <div class="search-box" id="searchBox">
        <input type="text" class="search-input" id="searchInput" placeholder="What are you looking for?" aria-label="Search products">
        <span class="search-hint" id="searchHint">What are you looking for?</span>
        <div class="search-results" id="searchResults"></div>
    </div>
    <button class="search-toggle" id="searchToggle" type="button"><img src="search.png" alt="search"></button>
    <a href="cart.html" class="cart-button" id="cartButton" aria-label="Cart">
        <img src="cart-removebg-preview.png" alt="cart">
        <span class="cart-badge hidden" id="cartBadge">0</span>
    </a>
</div>

<div class="container">
    <h1>BAGS</h1>

    <div class="product-grid">
        <div class="product-card" data-title="Pokeball Bag" data-description="A handmade bag made with care and texture." data-link="bags.html">
            <div class="image-container" tabindex="0" role="button" aria-label="View details for Pokeball Bag" data-images="pokeball-bag1.png,pokeball-bag2.png" data-modal-images="horizontal-pokeball-bag1.png,horizontal-pokeball-bag2.png" data-title="Pokeball Bag" data-price="$45.00" data-description="A handmade bag made with care and texture.">
                <img src="pokeball-bag1.png" alt="Pokeball Bag">
                <div class="overlay">View Details</div>
            </div>
            <h2>Pokeball Bag</h2>
            <p class="price">$45.00</p>
        </div>

        <div class="product-card" data-title="Mini Tote" data-description="A compact tote with a handmade finish and roomy shape." data-link="bags.html">
            <div class="image-container" tabindex="0" role="button" aria-label="View details for Mini Tote" data-images="bags2.svg" data-title="Mini Tote" data-price="50,000 LBP" data-description="A compact tote with a handmade finish and roomy shape.">
                <img src="bags2.svg" alt="Mini Tote">
                <div class="overlay">View Details</div>
            </div>
            <h2>Mini Tote</h2>
            <p class="price">$50.00</p>
        </div>
    </div>

    <a href="index.html" class="button">Back</a>
</div>

<div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button class="modal-close" aria-label="Close">&times;</button>
        <div class="detail-gallery">
            <img class="detail-image" src="" alt="">
        </div>
        <div class="modal-actions">
            <button id="inquireButton" class="inquire-button">Inquire</button>
            <button id="addToCartButton" class="add-to-cart-button">Add to cart</button>
        </div>
    </div>
</div>

<script src="product-modal.js"></script>
<script src="site-ui.js"></script>
<script src="cart-badge.js"></script>
</body>
</html>
