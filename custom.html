<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Order</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="site-header">
    <div class="search-box" id="searchBox">
        <input type="text" class="search-input" id="searchInput" placeholder="What are you looking for?" aria-label="Search products">
        <span class="search-hint" id="searchHint">What are you looking for?</span>
        <div class="search-results" id="searchResults"></div>
    </div>
    <button class="search-toggle" id="searchToggle" type="button"><img src="images/search.svg" alt="Search"></button>
    <a href="cart.html" class="cart-button" id="cartButton" aria-label="Cart">
        <img src="images/cart.svg" alt="Cart">
        <span class="cart-badge hidden" id="cartBadge">0</span>
    </a>
</div>

<div class="container">


    <!-- Page title -->
    <h1>Custom Order</h1>



    <!-- Holds every product -->
    <div class="product-grid">


        <!-- ===== Custom Order ===== -->
        <div class="product-card">


            <div class="image-container">
                <img src="images/custom.jpg" alt="Custom Crochet Order">
                <div class="overlay">View Details</div>
            </div>


            <h2>Create Your Own Piece</h2>


            <p>
                Have a favorite color, character, or idea?
                Request a custom handmade keychain or earrings
                designed especially for you.
            </p>


            <p class="price">
                Custom Pricing
            </p>


        </div>




    </div>




    <!-- Back button -->
    <a href="index.html" class="button">
        Back
    </a>



</div>



</body>

<script src="site-ui.js"></script>
<script src="cart-badge.js"></script>

</html>
