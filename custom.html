<body>

<div class="site-header">

        <span class="search-hint" id="searchHint">What are you looking for?</span>
        <div class="search-results" id="searchResults"></div>

        <a href="cart.html" class="cart-button" id="cartButton" aria-label="Cart">
            <img src="cart.jpg" alt="cart">

</div>

    <!-- Page title -->
    <h1>Custom</h1>



    <!-- Holds every product -->
    <div class="product-grid">


        <!-- ===== Custom Order ===== -->
        <div class="product-card" data-title="Create Your Own Piece" data-description="Have a favorite color, character, or idea? Request a custom handmade keychain or earrings designed especially for you." data-link="custom.html">

                <img src="images/custom.jpg" alt="Custom Crochet Order">
