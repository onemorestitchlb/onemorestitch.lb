<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earrings</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- Page title -->
    <h1>Earrings</h1>



    <!-- Holds every product -->
    <div class="product-grid">

        <!-- ===== Earrings #1 ===== -->
        <div class="product-card">


            <div class="image-container" tabindex="0" role="button" aria-label="View details for Crochet Earrings" data-image="images/earrings1.jpg" data-title="Crochet Earrings" data-price="15,000 LBP" data-description="This is an earring item. Write your description here.">
                <img src="images/earrings1.jpg" alt="Crochet Earrings">
                <div class="overlay">View Details</div>
            </div>


            <h2>Crochet Earrings</h2>


            <p class="price">15,000 LBP</p>


        </div>


        <!-- ===== Earrings #2 ===== -->
        <div class="product-card">


            <div class="image-container" tabindex="0" role="button" aria-label="View details for Flower Earrings" data-image="images/earrings2.jpg" data-title="Flower Earrings" data-price="20,000 LBP" data-description="This is an earring item. Write your description here.">
                <img src="images/earrings2.jpg" alt="Crochet Earrings">
                <div class="overlay">View Details</div>
            </div>


            <h2>Flower Earrings</h2>


            <p class="price">20,000 LBP</p>


        </div>




    </div>




    <!-- Back button -->
    <a href="index.html" class="button">
        Back
    </a>



</div>

<div id="productModal" class="modal" aria-hidden="true">
    <div class="modal-content">
        <button class="modal-close" aria-label="Close">&times;</button>
        <img class="detail-image" src="" alt="">
        <h2 class="detail-name"></h2>
        <p class="detail-price"></p>
        <h3>Description</h3>
        <!-- This is the place to write your description. -->
        <p class="detail-description"></p>
        <button id="inquireButton" class="inquire-button">Inquire</button>
        <a id="instagramButton" class="instagram-button hidden" href="https://www.instagram.com/onemorestitch.lb?igsh=cTN5Mm93dzJjZDBz&utm_source=qr" target="_blank" rel="noopener noreferrer">Contact on Instagram</a>
    </div>
</div>

</body>

<script src="product-modal.js"></script>

</html>
