<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container checkout-page">
    <h1>Checkout</h1>

    <div class="checkout-summary">
        <h2>Items</h2>
        <div id="checkoutItems" class="checkout-items"></div>
    </div>

    <form id="checkoutForm" class="checkout-form">
        <label class="checkout-field">
            <span>City:</span>
            <input type="text" id="cityInput" name="city" required>
        </label>

        <label class="checkout-field">
            <span>Address (more details):</span>
            <textarea id="addressInput" name="address" rows="4" required></textarea>
        </label>

        <label class="checkout-field">
            <span>Phone Number:</span>
            <input type="tel" id="phoneInput" name="phone" required>
        </label>

        <p id="deliveryTotal" class="checkout-total"></p>

        <div class="checkout-actions">
            <button type="submit" class="button checkout-button" disabled>Confirm order</button>
            <a href="index.html" class="button secondary-button">Continue Shopping</a>
        </div>
    </form>
</div>

<div id="thankYouModal" class="modal" aria-hidden="true">
    <div class="modal-content thank-you-modal">
        <h2>Thank you for shopping with onemorestitch.lb!</h2>
        <div class="checkout-actions">
            <a href="index.html" class="button secondary-button">Continue Shopping</a>
        </div>
    </div>
</div>

<script src="checkout.js"></script>
</body>
</html>
