<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plushies</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Page title -->
    <h1>Plushies</h1>

    <!-- Holds every plushie -->
    <div class="product-grid">

        <!-- ===== Plushie #1 ===== -->
        <div class="product-card">

            <!-- Product image -->
            <div class="image-container">
                <img src="hey.jpg" alt="hey">
                <div class="overlay">View Details</div>
            </div>

            <!-- Product name -->
            <h2>Hey</h2>

            <!-- Product price -->
            <p class="price">25,000 LBP</p>

        </div>

        <div class="product-card">

        <div class="image-container">
            <img src="hi.jpg" alt="hi">
            <div class="overlay">View Details</div>
        </div>

        <h2>Hi</h2>

        <p class="price">30,000 LBP</p>

        </div>

    </div>

    <a href="index.html" class="button">
        Back
    </a>

</div>

</body>

</html>
