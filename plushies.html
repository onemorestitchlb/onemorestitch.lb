<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plushies</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Page title -->
    <h1>Plushies</h1>

    <!-- Holds every plushie -->
    <div class="product-grid">

        <!-- ===== Plushie #1 ===== -->
        <div class="product-card">

            <!-- Product image -->
            <img src="images/hey.jpg" alt="Bulbasaur">

            <!-- Product name -->
            <h2>Bulbasaur</h2>

            <!-- Product price -->
            <p class="price">25,000 LBP</p>

        </div>

        <div class="product-card">

        <img src="images/hi.jpg" alt="Pikachu">

        <h2>Pikachu</h2>

        <p class="price">30,000 LBP</p>

        </div>

    </div>

    <a href="index.html" class="button">
        Back
    </a>

</div>

</body>

</html>
