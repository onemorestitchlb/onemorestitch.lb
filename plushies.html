<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plushies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="site-header">
    <div class="search-box" id="searchBox">
        <input type="text" class="search-input" id="searchInput" placeholder="What are you looking for?" aria-label="Search products">
        <span class="search-hint" id="searchHint">What are you looking for?</span>
        <div class="search-results" id="searchResults"></div>
    </div>
    <button class="search-toggle" id="searchToggle" type="button"><img src="search.png" alt="search"></button>
        <a href="cart.html" class="cart-button" id="cartButton" aria-label="Cart">
            <img src="cart-removebg-preview.png" alt="cart">
            <span class="cart-badge hidden" id="cartBadge">0</span>
        </a>
</div>

<div class="container">

    <!-- Page title -->
    <h1>PLUSHIES</h1>

    <!-- Holds every plushie -->
    <div class="product-grid">

        <!-- ===== Plushie #1 ===== -->
        <div class="product-card" data-title="Pompompurin" data-description="This is a plushie item. Greetings." data-link="plushies.html">

            <!-- Product image -->
            <div class="image-container" tabindex="0" role="button" aria-label="View details for Pompompurin" data-image="pompompurin.png" data-title="Pompompurin" data-price="$30.00" data-description="This is a plushie item. Greetings.">
                <img src="pompompurin.png" alt="Pompompurin">
                <div class="overlay">View Details</div>
            </div>

            <!-- Product name -->
            <h2>Pompompurin</h2>

            <!-- Product price -->
            <p class="price">$30.00</p>

        </div>

        <div class="product-card" data-title="Winnie The Pooh" data-description="This is a plushie item. Greetings." data-link="plushies.html">

        <div class="image-container" tabindex="0" role="button" aria-label="View details for Winnie The Pooh" data-image="winniethepooh.png" data-title="Winnie The Pooh" data-price="$25.00" data-description="This is a plushie item. Greetings.">
            <img src="winniethepooh.png" alt="Winnie The Pooh">
            <div class="overlay">View Details</div>
        </div>

        <h2>Winnie The Pooh</h2>

        <p class="price">$25.00</p>

        </div>

    </div>

    <div id="productModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">&times;</button>
            <img class="detail-image" src="" alt="">
            <h2 class="detail-name"></h2>
            <p class="detail-price"></p>
            <!-- This is the place to write your description. -->
            <p class="detail-description"></p>
            <div class="modal-actions">
                <button id="inquireButton" class="inquire-button">Inquire</button>
                <button id="addToCartButton" class="add-to-cart-button">Add to cart</button>
                <a id="instagramButton" class="instagram-button hidden" href="https://www.instagram.com/onemorestitch.lb?igsh=cTN5Mm93dzJjZDBz&utm_source=qr" target="_blank" rel="noopener noreferrer">Contact on Instagram</a>
            </div>
        </div>
    </div>

    <a href="index.html" class="button">
        Back
    </a>

</div>

</body>

<script src="product-modal.js"></script>
<script src="site-ui.js"></script>
<script src="cart-badge.js"></script>

</html>
