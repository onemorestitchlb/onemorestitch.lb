<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plushies</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Page title -->
    <h1>Plushies</h1>

    <!-- Holds every plushie -->
    <div class="product-grid">

        <!-- ===== Plushie #1 ===== -->
        <div class="product-card">

            <!-- Product image -->
            <div class="image-container" tabindex="0" role="button" aria-label="View details for Hey" data-image="hey.jpg" data-title="Hey" data-price="25,000 LBP" data-description="This is a plushie item. Write your description here.">
                <img src="hey.jpg" alt="hey">
                <div class="overlay">View Details</div>
            </div>

            <!-- Product name -->
            <h2>Hey</h2>

            <!-- Product price -->
            <p class="price">25,000 LBP</p>

        </div>

        <div class="product-card">

        <div class="image-container" tabindex="0" role="button" aria-label="View details for Hi" data-image="hi.jpg" data-title="Hi" data-price="30,000 LBP" data-description="This is a plushie item. Write your description here.">
            <img src="hi.jpg" alt="hi">
            <div class="overlay">View Details</div>
        </div>

        <h2>Hi</h2>

        <p class="price">30,000 LBP</p>

        </div>

    </div>

    <div id="productModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <button class="modal-close" aria-label="Close">&times;</button>
            <img class="detail-image" src="" alt="">
            <h2 class="detail-name"></h2>
            <p class="detail-price"></p>
            <h3>Description</h3>
            <!-- This is the place to write your description. -->
            <p class="detail-description"></p>
            <button id="inquireButton" class="inquire-button">Inquire</button>
            <a id="instagramButton" class="instagram-button hidden" href="https://www.instagram.com/onemorestitch.lb?igsh=cTN5Mm93dzJjZDBz&utm_source=qr" target="_blank" rel="noopener noreferrer">Contact on Instagram</a>
        </div>
    </div>

    <a href="index.html" class="button">
        Back
    </a>

</div>

</body>

<script src="product-modal.js"></script>

</html>
